# hpwne variant: slower birth spin, P0 = 100 ms, which moves the cutoff towards
# the knee at the price of an extreme efficiency (xi = 1 when plotting).
#
# Identical to youngpulsars_H5.ini except for the initial period.

seed = 0

pid = H
spiralmodel = Steiman2010
transportmodel = PureDiffusion
injectionmodel = YoungPulsars

# Output energy grid
emin = 1e4
emax = 1e8
esize = 64

# Galaxy geometry
hkpc = 5.0
rgkpc = 20.0
sunkpc = 8.3

# Source population
snrateyr = 0.0166666666667   # one pulsar every 60 yr
maxtimemyr = 100.0

# Birth properties
efficiency = 1.0
youngpulsarsp0ms = 100.0
youngpulsarssigmap0ms = 10.0
youngpulsarsrandomp0 = true
youngpulsarsb0gauss = 2.5e12
youngpulsarssigmalog10b = 0.5
youngpulsarsrandomb = true
