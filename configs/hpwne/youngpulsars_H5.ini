# hpwne fiducial model: proton injection by young pulsars, P0 = 60 ms.
#
#   ./runYoungPulsars ../configs/hpwne/youngpulsars_H5.ini --seed 0 --outdir ../runs/hpwne
#
# The simulation is run at efficiency = 1; the CR efficiency xi is applied when
# plotting, so a single run serves every value of xi.

seed = 0

pid = H
spiralmodel = Steiman2010
transportmodel = PureDiffusion
injectionmodel = YoungPulsars

# Output energy grid
emin = 1e4
emax = 1e8
esize = 64

# Galaxy geometry
hkpc = 5.0
rgkpc = 20.0
sunkpc = 8.3

# Source population
snrateyr = 0.0166666666667   # one pulsar every 60 yr
maxtimemyr = 100.0

# Birth properties
efficiency = 1.0
youngpulsarsp0ms = 60.0
youngpulsarssigmap0ms = 10.0
youngpulsarsrandomp0 = true
youngpulsarsb0gauss = 2.5e12
youngpulsarssigmalog10b = 0.5
youngpulsarsrandomb = true
