# Slow-birth-spin population (P0 = 130 ms) with an energy-independent diffusion coefficient
# above the rigidity hardening: delta = 0, so D = 0.42 (H/kpc) kpc^2/Myr at all
# energies, i.e. D/H is a factor (E/TeV)^0.36 smaller than in the fiducial model
# -- about one order of magnitude at 1 PeV.
#
# Identical to youngpulsars_H5_100msec_flatD.ini except for delta.

seed = 0

pid = H
spiralmodel = Steiman2010
transportmodel = PureDiffusion
injectionmodel = YoungPulsars

# Output energy grid
emin = 1e4
emax = 1e8
esize = 64

# Galaxy geometry
hkpc = 5.0
rgkpc = 20.0
sunkpc = 8.3

# Transport: energy-independent diffusion
d0h = 0.42
e0 = 1000
delta = 0.0

# Source population
snrateyr = 0.0166666666667   # one pulsar every 60 yr
maxtimemyr = 100.0

# Birth properties
efficiency = 1.0
youngpulsarsp0ms = 130.0
youngpulsarssigmap0ms = 10.0
youngpulsarsrandomp0 = true
youngpulsarsb0gauss = 2.5e12
youngpulsarssigmalog10b = 0.5
youngpulsarsrandomb = true
