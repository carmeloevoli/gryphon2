# One Myr of pulsar births in the hpwne geometry: the snapshot behind the
# Galactic-plane figure. Same geometry and rate as youngpulsars_H4.ini, but a
# short integration time so a single realization stays plottable.
#
#   ./inspectEvents ../configs/hpwne/events_1Myr.ini --outdir ../runs/hpwne

seed = 0

pid = H
spiralmodel = Steiman2010
transportmodel = PureDiffusion
injectionmodel = YoungPulsars

hkpc = 5.0
rgkpc = 20.0
sunkpc = 8.3

snrateyr = 0.0166666666667   # one pulsar every 60 yr
maxtimemyr = 1.0
