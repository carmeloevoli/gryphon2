# SNR population with a log-normally distributed cutoff energy,
# median Emax = 5 PeV with a 0.4 dex spread.
#
#   ./runRandomEmax ../configs/hpwne/randomemax_H4_5PeV_sigma0p4.ini --seed 0 --outdir ../runs/hpwne

seed = 0

pid = H
spiralmodel = Steiman2010
transportmodel = PureDiffusion
injectionmodel = RandomEmax

# Output energy grid
emin = 1e2
emax = 1e8
esize = 64

# Galaxy geometry
hkpc = 4.0
rgkpc = 20.0
sunkpc = 8.3

# Source population
snrateyr = 0.02               # one SN per 50 yr
maxtimemyr = 100.0

# Injection spectrum
efficiency = 0.1
injslope = 2.32
injemax = 5e6                 # median cutoff, 5 PeV
injemaxsigmadex = 0.4
injemaxmin = 1e5              # 100 TeV
injemaxmax = 1e8              # 100 PeV
