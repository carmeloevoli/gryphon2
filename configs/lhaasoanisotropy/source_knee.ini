# Proton source-knee benchmark.  The injected spectrum steepens by the amount
# and with the smoothness measured by LHAASO, while diffusion is unbroken.
# The grid extends to 100 PeV to expose the high-energy model separation.

seed = 0
pid = H
spiralmodel = Steiman2010
transportmodel = PureDiffusion
injectionmodel = SmoothBrokenPowerLaw

emin = 1e5
emax = 1e8
esize = 73

hkpc = 4.0
discsizepc = 50.0
rgkpc = 20.0
sunkpc = 8.3

d0h = 0.42
e0 = 1000
delta = 0.36
ddelta = -1

snrateyr = 0.02
maxtimemyr = 5.0

efficiency = 0.1
injslope = 2.15
injdeltaslope = 0.99
injbreakenergy = 3.3e6
injsmoothness = 0.2673
injemax = 1e9
