# runMSP: present-day MSP population, stationary positron injection.
# Geometry: native GalaxyJelly / SourceProfile, not the previous Gaussian disk.
seed = 20260924
spiralmodel = Jelly
a = 1.9
b = 5.0
r1kpc = 0
rgkpc = 20
sunkpc = 8.5
discsizepc = 1000  # Gaussian standard deviation in z, an explicit MSP benchmark
hkpc = 5

injectionmodel = MSP
mspsources = 49000
mspperiodminms = 1.5
msplog10b = 8.0
mspsigmalog10b = 0.2
mspinertiagcm2 = 1e45
mspemingev = 10
injslope = 1
injemax = 400
efficiency = 1  # total pair efficiency; the positron share is 1/2

transportmodel = DiffusionLosses
e0 = 10
d0h = 0.04     # D0 = (D0/H)*H = 0.2 kpc^2/Myr
delta = 0.56
ddelta = -1
bmug = 1
urad = 0.475   # U_rad + U_B ~= 0.5 eV/cm^3; b computed by the native kernel

emin = 10
emax = 2000
esize = 81
mspquadrature = 256
mspdistances = 1601
# SN rate, timestep and maxtime are NOT used by this snapshot calculation.
